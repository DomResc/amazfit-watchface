name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:packaging
      - run: npm run typecheck
      - run: npm install --global @zeppos/zeus-cli@1.9.3
      - run: npm run build -- essential
      - run: npm run build -- matrix
