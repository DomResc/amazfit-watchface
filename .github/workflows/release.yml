name: Release Watchface
on:
  push:
    tags:
      - 'essential-v*'
      - 'matrix-v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.release.outputs.name }}
      title: ${{ steps.release.outputs.title }}
      version: ${{ steps.release.outputs.version }}
      asset: ${{ steps.release.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Verify tag and manifest
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-config.mjs >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run test:packaging
      - run: npm run typecheck
      - run: npm install --global @zeppos/zeus-cli@1.9.3
      - name: Build selected watchface
        env:
          WATCHFACE_NAME: ${{ steps.release.outputs.name }}
        run: npm run build -- "$WATCHFACE_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: watchface-release
          path: src/watchfaces/${{ steps.release.outputs.name }}/dist/${{ steps.release.outputs.asset }}
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: watchface-release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          WATCHFACE_NAME: ${{ needs.build.outputs.name }}
          WATCHFACE_TITLE: ${{ needs.build.outputs.title }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" release/*.zip \
            --repo "$GH_REPO" --verify-tag \
            --title "$WATCHFACE_TITLE $RELEASE_VERSION" \
            --notes-file "src/watchfaces/$WATCHFACE_NAME/RELEASE_NOTES.md"
